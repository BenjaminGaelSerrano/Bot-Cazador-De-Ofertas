name: Cazador de ofertas

on:
  schedule:
    # Cada 2 horas desde que eBay renueva el cupo (05:00 AR). Minuto no redondo: a la hora en punto GitHub demora más los
    # programados. Repo público: los minutos de Actions no tienen límite. Cada 1 hora se puede, pero leer los catálogos tan
    # seguido arriesga que las tiendas bloqueen (Parfumerie, 2026-10-23).
    # TIENEN QUE COINCIDIR con config.ebay.corridasUtc (el cupo de eBay se reparte entre estas corridas).
    - cron: '17 8 * * *'   # 05:17 en Argentina
    - cron: '17 10 * * *'  # 07:17 en Argentina
    - cron: '17 12 * * *'  # 09:17 en Argentina
    - cron: '17 14 * * *'  # 11:17 en Argentina
    - cron: '17 16 * * *'  # 13:17 en Argentina
    - cron: '17 18 * * *'  # 15:17 en Argentina
    - cron: '17 20 * * *'  # 17:17 en Argentina
    - cron: '17 22 * * *'  # 19:17 en Argentina
    - cron: '17 0 * * *'   # 21:17 en Argentina
    - cron: '17 2 * * *'   # 23:17 en Argentina
    - cron: '17 4 * * *'   # 01:17 en Argentina
    - cron: '17 6 * * *'   # 03:17 en Argentina
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo simular (no escribe datos ni manda WhatsApp)'
        type: boolean
        default: true
      forzar:
        description: 'Forzar: avisar todo lo que vale la pena aunque ya se haya avisado'
        type: boolean
        default: false

# Una sola corrida a la vez: dos escribiendo la rama de datos se pisarían.
concurrency:
  group: cazador
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cazar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REMOTO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pruebas
        run: npm test

      # El historial, las alertas y las fallas viven en la rama `datos`, no en `main`.
      # Si todavía no existe (primera corrida), se arranca una vacía.
      - name: Preparar la rama de datos
        run: |
          if git ls-remote --exit-code --heads "$REMOTO" datos > /dev/null 2>&1; then
            git clone --depth 1 --branch datos "$REMOTO" datos
          else
            git init -q -b datos datos
            git -C datos remote add origin "$REMOTO"
          fi

      - name: Cazar ofertas
        run: node src/cli.mjs --fuente todas --datos datos ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.forzar) && '--forzar' || '' }}
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      # always(): si el bot falló, igual hay que guardar fallas.json para no repetir el aviso en cada corrida.
      - name: Guardar datos
        if: always()
        run: |
          cd datos
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -q -m "datos: corrida del $(date -u +%F' '%H:%M) UTC"
            git push origin HEAD:datos
          fi
